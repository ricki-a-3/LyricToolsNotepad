# XcodeGen spec: `xcodegen` turns this into LyricToolsNotepad.xcodeproj.
# Run ./build-rust.sh first (it creates Generated/).
name: LyricToolsNotepad
options:
  bundleIdPrefix: io.github.rickia3
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  LyricToolsNotepad:
    type: application
    platform: iOS
    sources:
      - path: LyricToolsNotepad
      - path: ../assets/fonts
        buildPhase: resources
        excludes: ["*.txt"]
      - path: Generated/bindings/lyrics_ffi.swift
    dependencies:
      - framework: Generated/LyricsFFI.xcframework
        embed: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LyricToolsNotepad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
          - JetBrainsMono-Italic.ttf
          - JetBrainsMono-BoldItalic.ttf
        # Show the app's own folder in Files ("On My iPhone").
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Lyrics
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rickia3.LyricToolsNotepad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  LyricToolsNotepadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LyricToolsNotepadTests
    dependencies:
      - target: LyricToolsNotepad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rickia3.LyricToolsNotepadTests
schemes:
  LyricToolsNotepad:
    build:
      targets:
        LyricToolsNotepad: all
        LyricToolsNotepadTests: [test]
    test:
      targets:
        - LyricToolsNotepadTests
