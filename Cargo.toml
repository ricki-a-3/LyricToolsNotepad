[workspace]
members = [".", "crates/lyrics-core", "crates/lyrics-ffi"]

[package]
name = "lyrictoolsnotepad"
version = "1.1.0"
edition = "2024"
description = "LyricToolsNotepad: a lyric notepad with live syllable counts and rhyme suggestions"
license = "MIT"
rust-version = "1.88"

[[bin]]
name = "LyricToolsNotepad"
path = "src/main.rs"

[dependencies]
lyrics-core = { path = "crates/lyrics-core" }
dirs = "7.0.0"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu", "x11", "wayland"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"

# iOS static libraries: still optimized, but much faster to build in CI than
# the Windows release profile (full LTO, one codegen unit).
[profile.mobile]
inherits = "release"
lto = "thin"
codegen-units = 8
