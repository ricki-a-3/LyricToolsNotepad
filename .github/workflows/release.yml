name: Release

# Publish a release on GitHub (Releases -> Draft a new release, tag e.g.
# v1.0.1) and this builds the Windows installer + portable zip on Windows and
# attaches them to it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${{ github.event.release.tag_name }}"
          if [ "v$version" != "$tag" ]; then
            echo "Release tag $tag does not match Cargo.toml version $version"; exit 1
          fi

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Build installer + portable zip
        shell: cmd
        run: build_release.bat

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-setup.exe
            dist/*-portable-win64.zip
          tag_name: ${{ github.event.release.tag_name }}
