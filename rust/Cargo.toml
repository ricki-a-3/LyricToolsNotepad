[package]
name = "lyrictools"
version = "3.0.0-alpha.1"
edition = "2024"
description = "LyricTools++: a lyric notepad with live syllable counts and rhyme suggestions"
license = "MIT"
rust-version = "1.88"

[[bin]]
name = "LyricToolsPP"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
