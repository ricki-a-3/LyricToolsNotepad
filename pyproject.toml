[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyrictools"
version = "3.0.0.dev0"
description = "Standalone lyric-writing app with live syllable counts and rhyme suggestions"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
lyrictools = "lyrictools.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lyrictools = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
